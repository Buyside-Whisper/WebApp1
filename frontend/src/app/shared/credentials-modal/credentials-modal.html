<app-modal [open]="credentials() !== null" [title]="title()" (closed)="closed.emit()">
  @if (credentials(); as login) {
    <div class="page-stack">
      <p class="page-description credentials-note">
        Give these to <strong>{{ login.displayName }}</strong
        >. The password is shown only now and can't be looked up later, only reset.
      </p>

      <div class="credentials-card">
        <div class="credentials-row">
          <span class="credentials-label">Username</span>
          <code class="code-tag credentials-value">{{ login.username }}</code>
          <button
            type="button"
            class="button button--secondary button--sm"
            (click)="copy('username', login.username)"
          >
            {{ copied() === 'username' ? 'Copied' : 'Copy' }}
          </button>
        </div>
        <div class="credentials-row">
          <span class="credentials-label">Password</span>
          <code class="code-tag credentials-value">{{ login.password }}</code>
          <button
            type="button"
            class="button button--secondary button--sm"
            (click)="copy('password', login.password)"
          >
            {{ copied() === 'password' ? 'Copied' : 'Copy' }}
          </button>
        </div>
      </div>

      <div class="button-row credentials-actions">
        <button type="button" class="button button--primary" (click)="closed.emit()">Done</button>
      </div>
    </div>
  }
</app-modal>
