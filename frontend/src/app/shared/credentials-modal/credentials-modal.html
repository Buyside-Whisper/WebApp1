<app-modal [open]="credentials() !== null" [title]="title() | t" (closed)="closed.emit()">
  @if (credentials(); as login) {
    <div class="page-stack">
      <p class="page-description credentials-note">
        {{ 'Give these to' | t }} <strong>{{ login.displayName }}</strong
        >{{ '. The password is shown only now and can\'t be looked up later, only reset.' | t }}
      </p>

      <div class="credentials-card">
        <div class="credentials-row">
          <span class="credentials-label">{{ 'Username' | t }}</span>
          <code class="code-tag credentials-value">{{ login.username }}</code>
          <button
            type="button"
            class="button button--secondary button--sm"
            (click)="copy('username', login.username)"
          >
            {{ copied() === 'username' ? ('Copied' | t) : ('Copy' | t) }}
          </button>
        </div>
        <div class="credentials-row">
          <span class="credentials-label">{{ 'Password' | t }}</span>
          <code class="code-tag credentials-value">{{ login.password }}</code>
          <button
            type="button"
            class="button button--secondary button--sm"
            (click)="copy('password', login.password)"
          >
            {{ copied() === 'password' ? ('Copied' | t) : ('Copy' | t) }}
          </button>
        </div>
      </div>

      <div class="button-row credentials-actions">
        <button type="button" class="button button--primary" (click)="closed.emit()">{{ 'Done' | t }}</button>
      </div>
    </div>
  }
</app-modal>
