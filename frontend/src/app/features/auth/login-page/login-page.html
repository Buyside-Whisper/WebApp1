<div class="login-page">
  <app-language-switch class="login-language" />
  <form class="login-card" (ngSubmit)="signIn()">
    <div class="login-brand">WebApp1</div>
    <h1 class="login-title">{{ 'Sign in' | t }}</h1>
    <p class="page-description">{{ 'Use the username and password you were given.' | t }}</p>

    <div class="field">
      <label for="username">{{ 'Username' | t }}</label>
      <input
        id="username"
        class="text-input"
        name="username"
        autocomplete="username"
        [(ngModel)]="username"
        required
      />
    </div>

    <div class="field">
      <label for="password">{{ 'Password' | t }}</label>
      <input
        id="password"
        class="text-input"
        type="password"
        name="password"
        autocomplete="current-password"
        [(ngModel)]="password"
        required
      />
    </div>

    @if (errorMessage()) {
      <p class="field-error">{{ errorMessage() | t }}</p>
    }

    <button type="submit" class="button button--primary" [disabled]="isLoading()">
      {{ isLoading() ? ('Signing in…' | t) : ('Sign in' | t) }}
    </button>

    <a class="login-link" routerLink="/superadmin/login">{{ 'Platform owner? Sign in here' | t }}</a>
  </form>
</div>
